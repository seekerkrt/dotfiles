model = "gpt-6-astra"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
model_reasoning_effort = "high"
model_verbosity = "medium"
approval_policy = "on-request"
default_permissions = "workspace-handoff"
web_search = "cached"
approvals_reviewer = "user"
service_tier = "default"
personality = "pragmatic"

[permissions.workspace-handoff]
description = "Current workspace plus handoff directory"
extends = ":workspace"

[permissions.workspace-handoff.workspace_roots]
"~/handoff" = true

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "project-name",
    "git-branch",
    "branch-changes",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
]
status_line_use_colors = true
theme = "solarized-dark"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.4" = "gpt-5.5"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/seeke/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
CODEX_HOME = "/home/seeke/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.908.70816"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/seeke/.codex/plugins/cache/openai-bundled/browser/26.908.70816/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

[features]
prevent_idle_sleep = true

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = false
hotkey-window-projectless-default-enabled = true
external-agent-import-sync-enabled = true

[desktop.external-agent-import-sync-item-types]
SESSIONS = false
CONFIG = "original"
SKILLS = "original"
PLUGINS = "original"
HOOKS = "original"

[marketplaces.openai-bundled]
source_type = "local"
source = "/home/seeke/.codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "/home/seeke/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."clangd-lsp@claude-plugins-official"]
enabled = true

[plugins."pyright-lsp@claude-plugins-official"]
enabled = true

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
DISABLE_TELEMETRY = "1"
