model = "gpt-6-astra"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
model_reasoning_effort = "high"
model_verbosity = "medium"
approval_policy = "on-request"
default_permissions = "workspace-dev"
web_search = "cached"
approvals_reviewer = "user"
service_tier = "default"
personality = "pragmatic"

[permissions.workspace-dev]
description = "Current workspace plus handoff and ramdisk directories"
extends = ":workspace"

[permissions.workspace-dev.workspace_roots]
"~/handoff" = true
"/ramdisk" = true

[agents]
enabled = true
max_concurrent_threads_per_session = 4

[agents.handoff]
description = "Create the final handoff only. Do not implement or modify production work."
config_file = "./agents/handoff-luna.toml"

[tui]
status_line = [
    "model-with-reasoning",
    "current-dir",
    "project-name",
    "git-branch",
    "branch-changes",
    "context-used",
    "five-hour-limit",
    "weekly-limit",
]
status_line_use_colors = true
theme = "solarized-dark"

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.4" = "gpt-5.5"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[features]
prevent_idle_sleep = true

[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."clangd-lsp@claude-plugins-official"]
enabled = true

[plugins."pyright-lsp@claude-plugins-official"]
enabled = true

[shell_environment_policy]
inherit = "core"

