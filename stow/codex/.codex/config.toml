model = "gpt-6.1-sol"
model_context_window = 1000000
model_auto_compact_token_limit = 900000
model_reasoning_effort = "xhigh"
model_verbosity = "medium"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
default_permissions = "workspace-dev"
web_search = "cached"
service_tier = "fast"
personality = "pragmatic"

[browser_use.default_origin_policy]
access = "allow"
uploads = "deny"
full_cdp_access = "deny"

[computer_use]
default_app_access = "allow"

[auto_review]
policy = """
以下の条件を満たす、非破壊的なローカル開発コマンドは承認してよい。

- 対象がリポジトリ配下、/ramdisk、/tmp、~/handoff に限定されている
- ビルド、テスト、検証、静的解析、フォーマット、lint が目的である
- cmake、ninja、make、ctest、コンパイラ、リンカ、テストランナーなど通常の開発ツールである
- AF_UNIX socket を使用するテストなど、sandbox の制約だけが理由で sandbox 外実行を必要としている
- Git / GitHub の読み取り専用操作である

特に、既存のテストスイートを実行する ctest が
AF_UNIX socket の作成制限によって sandbox 外実行を要求している場合は、
非破壊的な検証処理として承認してよい。

以下は自動承認しない。

- git reset、git restore、git clean、git stash など作業内容を失う可能性がある操作
- force push
- ファイルやディレクトリの広範囲な削除
- sudo や権限昇格
- システム設定の変更
- パッケージのシステム全体へのインストールや削除
- 認証情報、秘密鍵、トークン、パスワード等へのアクセス
- /etc やシステム領域への書き込み
- ユーザーが明示的に許可していない外部への破壊的変更
- 上記の安全条件に該当するか判断できない操作
- 購入、契約、プラン変更、無料トライアル開始、
  従量課金の有効化、決済情報の入力・送信など、
  金銭的副作用のある操作。
  ユーザーの明示依頼があっても自動承認しない。

判断に迷う場合はユーザーへ承認を求めること。
"""

[features.network_proxy]
enabled = true
allow_local_binding = true

[permissions.workspace-dev.network.unix_sockets]
"/run/docker.sock" = "allow"
"/var/run/docker.sock" = "allow"

[permissions.workspace-dev]
description = "Current workspace plus handoff and ramdisk directories"
extends = ":workspace"

[permissions.workspace-dev.workspace_roots]
"~/handoff" = true
"/ramdisk" = true

[permissions.workspace-dev.network]
enabled = true
allow_local_binding = true

[agents]
enabled = true
max_concurrent_threads_per_session = 5

[shell_environment_policy]
inherit = "all"

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "project-name",
  "git-branch",
  "branch-changes",
  "context-used",
  "weekly-limit",
]
status_line_use_colors = true
theme = "Tokyo Night Storm"
screen_reader_detection_done = true
fullscreen_transcript = false

[tui.model_availability_nux]
"gpt-6.1-sol" = 4

[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[features]
prevent_idle_sleep = true

[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[plugins."codex-app-tools@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."clangd-lsp@claude-plugins-official"]
enabled = true

[plugins."pyright-lsp@claude-plugins-official"]
enabled = true

[desktop]
followUpQueueMode = "steer"
preventSleepWhileRunning = true
