# ~/.codex/config.toml
# Plusプラン向け・常用の最小構成

model = "gpt-5.4"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
model_reasoning_effort = "medium"
model_verbosity = "medium"
approvals_reviewer = "user"

[sandbox_workspace_write]
network_access = false

[profiles.safe]
approval_policy = "on-request"
sandbox_mode = "read-only"
web_search = "cached"
model_reasoning_effort = "medium"
model_verbosity = "medium"

[profiles.deep]
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "cached"
model_reasoning_effort = "high"
model_verbosity = "medium"

[projects."/home/seeke/jadeos"]
trust_level = "trusted"

[projects."/home/seeke/jadec"]
trust_level = "trusted"

[projects."/home/seeke/dotfiles"]
trust_level = "trusted"

[projects."/home/seeke/jpacker"]
trust_level = "trusted"

[tui]
status_line = ["model-with-reasoning", "current-dir", "five-hour-limit", "weekly-limit", "context-usage", "codex-version", "fast-mode"]

[tui.model_availability_nux]
"gpt-5.5" = 3
