<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <!-- アンチエイリアス 有効 -->
 <!-- サブピクセル RGB -->
 <match target="font">
  <edit mode="assign" name="rgba">
   <const>rgb</const>
  </edit>
 </match>
 <!-- ヒンティング Medium -->
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
  <edit mode="assign" name="hintstyle">
   <const>hintmedium</const>
  </edit>
 </match>
 <!-- sans-serif → MyricaM M -->
 <match target="pattern">
  <test name="family">
   <string>sans-serif</string>
  </test>
  <edit mode="assign" name="family">
   <string>MyricaM M</string>
  </edit>
 </match>
 <!-- serif → MyricaM M -->
 <match target="pattern">
  <test name="family">
   <string>serif</string>
  </test>
  <edit mode="assign" name="family">
   <string>MyricaM M</string>
  </edit>
 </match>
 <!-- monospace → MyricaM M -->
 <match target="pattern">
  <test name="family">
   <string>monospace</string>
  </test>
  <edit mode="assign" name="family">
   <string>MyricaM M</string>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
</fontconfig>
