# スクロール設定
scrolling:
  history: 10000
  multiplier: 3
  
#フォント設定  
font:
  size: 11
  normal:
    family: Mgen+ 1mn
    style: Regular

  bold:
    family: Mgen+ 1mn
    style: Bold

  italic:
    family: Mgen+ 1mn
    style: Italic

  bold_italic:
    family: Mgen+ 1mn
    style: Bold Italic


# Colors (Solarized Dark)
colors:
  # Default colors
  primary:
    background: '0x002b36'
    foreground: '0x839496'

  # Normal colors
  normal:
    black:   '0x073642'
    red:     '0xdc322f'
    green:   '0x859900'
    yellow:  '0xb58900'
    blue:    '0x268bd2'
    magenta: '0xd33682'
    cyan:    '0x2aa198'
    white:   '0xeee8d5'

  # Bright colors
  bright:
    black:   '0x002b36'
    red:     '0xcb4b16'
    green:   '0x586e75'
    yellow:  '0x657b83'
    blue:    '0x839496'
    magenta: '0x6c71c4'
    cyan:    '0x93a1a1'
    white:   '0xfdf6e3'

#透過設定
window_opacity: 0.8  # value range is 0 ~ 1